name: ZenxyHologram
version: '1.0.0-SNAPSHOT'
main: com.zenxy.hologram.ZenxyHologramPlugin
api-version: '1.20'
author: ZenxyTeam
description: Next-Generation Modern TextDisplay & Packet-Based Hologram Plugin
softdepend: [ProtocolLib, PlaceholderAPI]

commands:
  zenxyhologram:
    description: Main ZenxyHologram management command
    aliases: [zholo, zh, hologram]
    permission: zenxyhologram.admin
    usage: /zholo <subcommand> [args]

permissions:
  zenxyhologram.admin:
    description: Gives access to all ZenxyHologram commands
    default: op
