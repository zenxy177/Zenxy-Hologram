# =======================================================
#               ZENXY HOLOGRAM CONFIGURATION
# =======================================================

settings:
  # Storage engine type: SQLITE (Recommended for zero lag & crash safety) or YAML
  storage-type: "SQLITE"

  # Hologram render distance in blocks for packet culling
  render-distance: 48

  # View update interval in server ticks (20 ticks = 1 second)
  update-interval-ticks: 5

  # Distance check interval in server ticks for visibility culling
  culling-interval-ticks: 10

  # Default line spacing offset (Y axis) for TextDisplays
  default-line-spacing: 0.3

  # Default billboard mode: CENTER, FIXED, VERTICAL, HORIZONTAL
  default-billboard: "CENTER"

  # Protocol provider mode: AUTO (prefers PacketEvents -> ProtocolLib -> Bukkit), PACKETEVENTS, PROTOCOLLIB, BUKKIT
  protocol-provider: "AUTO"

  # Enable debug mode in console
  debug: false
